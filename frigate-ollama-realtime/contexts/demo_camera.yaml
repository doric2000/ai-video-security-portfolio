camera_id: demo_camera
profile: office_standard
sensitivity: medium
camera_view:
  location_name: Synthetic demo room
  description: Invented lab setting with no connection to a real workplace.
areas_of_interest:
  - name: Demo entrance
    intent: Review presence outside configured demo hours.
security_intent:
  primary_risks: [After-hours presence, Extended loitering]
